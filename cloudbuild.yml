steps:
  # Docker Build
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/frontend/frontend-image:$COMMIT_SHA",
        ".",
      ]

  # Docker Push
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/$PROJECT_ID/frontend/frontend-image:$COMMIT_SHA",
      ]

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run", "deploy", "athena-frontend",
        "--image", "us-central1-docker.pkg.dev/$PROJECT_ID/frontend/frontend-image:$COMMIT_SHA",
        "--region", "us-central1",
        "--platform", "managed",
        "--allow-unauthenticated",
        "--port", "8080"
      ]

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/frontend/frontend-image:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY